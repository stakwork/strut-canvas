description: >-
  Implement a feature: starts the job that builds it, with the feature's brief (its requirements and
  architecture), and records the job on the feature, so its card shows what the job builds. Where the
  architecture says it is built picks the job: code in a repository is a Code Change job, workflows or an
  app on this strut server a builder job. Refuses a feature with no architecture. dry_run: the brief and
  which job, and nothing started.
input:
  feature: { type: string, description: "The feature's ref_id" }
  builds_in: { type: string, required: false, description: "repo or strut: overrides the architecture's" }
  repos: { type: json, required: false, description: "Repositories' https addresses (repo only): override the architecture's; none, and the job finds them" }
  dry_run: { type: boolean, default: false }
steps:
  - id: ctx
    type: read
    config:
      about: "{{ input.feature }}"
  - id: brief
    type: implement-brief
    config:
      ctx: "{{ ctx }}"
      feature: "{{ input.feature }}"
      builds_in: "{{ input.builds_in }}"
      repos: "{{ input.repos }}"
  - id: gate
    type: if
    config:
      cond: "{{ input.dry_run }}"
  - id: start
    type: job/start
    depends: gate
    when: false
    config:
      title: "{{ brief.title }}"
      prompt: "{{ brief.prompt }}"
      workflow: "{{ brief.workflow }}"
      kind: "{{ brief.kind }}"
      repos: "{{ brief.repos }}"
  - id: record
    type: job-started
    depends: start
    config:
      feature: "{{ input.feature }}"
      job: "{{ start.job }}"
  - id: result
    type: pack
    depends: [gate, record]
    config:
      dry_run: "{{ input.dry_run }}"
      title: "{{ brief.title }}"
      feature: "{{ brief.feature }}"
      builds_in: "{{ brief.builds_in }}"
      workflow: "{{ brief.workflow }}"
      repos: "{{ brief.repos }}"
      job: "{{ start?.job }}"
      text: "{{ input.dry_run ? 'Dry run: nothing started.' : 'Job started: ' + brief.title }}"
