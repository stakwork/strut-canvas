type_description: "A stage of an initiative, in order (sequence 1..n), with the features built in it. status is planned, active, done or dropped. Kept by the stadeum/canvas package."
attributes:
  name: string
  description: ?string
  status: string
  blocked: ?boolean
  blocked_reason: ?string
  completed_at: ?string
  sequence: ?int
  due_date: ?string
  author: ?string
  created_by_kind: ?string
  removed_at: ?int
  removed_by: ?string
  removed_reason: ?string
  removed_run: ?string
  removed_top: ?string
key_spec: ref_id
index: [name, description]
title_key: name
edges:
  - [HAS_FEATURE, Feature]
