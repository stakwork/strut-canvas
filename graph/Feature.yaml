type_description: "A piece of the solution, under a milestone: it SATISFIES requirements and HAS_ARCHITECTURE. jobs is a JSON list of the jobs started on it. status is planned, active, done or dropped. Kept by the stadeum/canvas package."
attributes:
  name: string
  description: ?string
  status: string
  blocked: ?boolean
  blocked_reason: ?string
  completed_at: ?string
  jobs: ?string
  author: ?string
  created_by_kind: ?string
  removed_at: ?int
  removed_by: ?string
  removed_reason: ?string
  removed_run: ?string
  removed_top: ?string
key_spec: ref_id
index: [name, description]
title_key: name
edges:
  - [SATISFIES, Requirement]
  - [HAS_ARCHITECTURE, Architecture]
