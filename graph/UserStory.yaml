type_description: "A user story of an initiative, as plain text, with the requirements it needs. Kept by the stadeum/canvas package."
attributes:
  name: string
  text: string
  status: ?string
  author: ?string
  created_by_kind: ?string
  removed_at: ?int
  removed_by: ?string
  removed_reason: ?string
  removed_run: ?string
  removed_top: ?string
key_spec: ref_id
index: [name, text]
title_key: name
edges:
  - [HAS_REQUIREMENT, Requirement]
